# Pepper CRM Workspace Manifest
#
#   Defines the Rust workspace members (core library, MCP servers, runner, web dashboard)
#   and shared dependency versions used across all crates.
#
# INPUT: None (Cargo manifest).
# OUTPUT: Workspace layout and pinned dependency versions for `cargo build` / `cargo run`.
# NOTES: Members include pepper-crm, pepper (orchestrator), pepper-web, and MCP server crates.
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[workspace]
members = [
    "pepper-crm",
    "mcp-vcard-server",
    "mcp-digest-server",
    "mcp-cal-server",
    "mcp-mailer-server",
    "mcp-calendar-server",
    "mcp-travel-server",
    "pepper",  # The runner/orchestrator binary
    "pepper-web",  # Web dashboard
]
resolver = "2"

[workspace.dependencies]
rmcp        = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
schemars    = { version = "1", features = ["derive", "chrono04"] }
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
chrono-tz   = "0.10"
tzf-rs      = "1.3"
uuid        = { version = "1", features = ["v4", "serde"] }
dotenvy     = "0.15"
tracing     = "0.1"
tracing-subscriber = "0.3"
tera        = "1"
lettre      = "0.11"
ical        = "0.10"
icalendar   = "0.16"
regex       = "1"
axum        = "0.7"
tower-http  = { version = "0.5", features = ["fs", "trace"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile    = "3"
