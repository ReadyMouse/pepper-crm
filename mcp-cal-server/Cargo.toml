# MCP Calendar Export Server Package
#
#   Cargo manifest for the MCP server that exports reconnect reminders as .ics files.
#
# INPUT:
#   - N/A (package metadata and dependency declarations)
#
# OUTPUT:
#   - `mcp-cal-server` binary exposing the `export_ics` MCP tool
#
# NOTES:
#   - Uses pepper-crm `build_ics` for iCalendar generation with alarms
#   - Distinct from mcp-calendar-server (Google Calendar ICS fetch)
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "mcp-cal-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-cal-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
pepper-crm = { path = "../pepper-crm" }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
