# Pepper Web Crate Manifest
#
#   Package definition for the localhost web dashboard binary.
#
# INPUT: None (Cargo manifest).
# OUTPUT: `pepper-web` binary depending on pepper-crm, Axum, Tera, SQLx, and workspace crates.
# NOTES: Run with `cargo run --bin pepper-web` from repo root; serves on 127.0.0.1:3000.
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "pepper-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pepper-web"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
pepper-crm = { path = "../pepper-crm" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
tera = { workspace = true }

# Web framework
axum = { workspace = true }
tower-http = { workspace = true }
