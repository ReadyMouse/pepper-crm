  Pepper CRM Digest Preview Page

    Live in-browser preview of the weekly email digest content.

  INPUT: Tera context — nav_active.
  OUTPUT: Dashboard chrome with iframe loading /preview/email (exact digest HTML).
  NOTES: Read-only preview; iframe avoids escaping issues with inline email HTML.

  Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digest Preview — Pepper CRM</title>
    <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
    {% include "partials/header.html" %}

    <div class="page-container page-container--narrow">
        <p class="preview-label">Live preview — this is exactly how the weekly email will look</p>
        <iframe
            class="digest-email-frame"
            title="Weekly digest email preview"
            src="/preview/email"
        ></iframe>
    </div>
</body>
</html>
