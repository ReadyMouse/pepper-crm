<!--
  Pepper CRM Site Header Partial

    Shared top navigation and brand avatar for dashboard and preview pages.

  INPUT: Tera variable nav_active ("dashboard" | "preview") to highlight current link.
  OUTPUT: HTML fragment included from partials/header.html (Tera include).
  NOTES: Avatar served from /assets/brand/pepper_avatar_teal.png (repo root assets/).

  Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.
-->
<header class="site-header">
    <div class="header-inner">
        <div class="header-brand">
            <h1>Pepper Please</h1>
        </div>
        <nav class="site-nav">
            <a href="/"{% if nav_active == "dashboard" %} class="active"{% endif %}>Dashboard</a>
            <a href="/preview"{% if nav_active == "preview" %} class="active"{% endif %}>Digest Preview</a>
        </nav>
        <img src="/assets/brand/pepper_avatar_teal.png" alt="Pepper" class="header-avatar" width="88" height="88">
    </div>
</header>
