# Pepper CRM Core Library
#
#   Rust library crate for vCard contact parsing, reconnect tag logic, PostgreSQL sync,
#   calendar travel matching, and geocoding. Consumed by the dashboard and CLI examples.
#
# INPUT:
#   - VCF files (CONTACTS_DIR), PostgreSQL (DATABASE_URL), optional Google Calendar ICS URL.
#
# OUTPUT:
#   - `pepper-crm` rlib with public modules re-exported from lib.rs.
#
# NOTES:
#   - Workspace dependencies (sqlx, tokio, serde, etc.) are inherited from the repo root.
#   - Examples: parse_contacts, test_calendar; integration test generates sample VCFs.
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "pepper-crm"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace dependencies
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

# Core-specific dependencies
ical = "0.10"          # vCard 2.1/3.0/4.0 parser
icalendar = "0.16"     # .ics generation
tera = "1"             # email templating
lettre = "0.11"        # SMTP sending
regex = "1"            # tag parsing
reqwest = { workspace = true }
dotenvy = { workspace = true }
rand = "0.8"

[[example]]
name = "test_calendar"
path = "examples/test_calendar.rs"

[[example]]
name = "parse_contacts"
path = "examples/parse_contacts.rs"

[[example]]
name = "random_pick_smoke"
path = "examples/random_pick_smoke.rs"

[dev-dependencies]
fake = { version = "2", features = ["derive", "chrono"] }
rand = "0.8"
tempfile = { workspace = true }
