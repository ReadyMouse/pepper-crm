# MCP Scheduler Server Package
#
#   Cargo manifest for the MCP server that syncs contacts/tasks/reconnects to Postgres.
#
# INPUT:
#   - N/A (package metadata and dependency declarations)
#
# OUTPUT:
#   - `mcp-scheduler-server` binary exposing `upsert_contacts` and `get_due` MCP tools
#
# NOTES:
#   - Requires `DATABASE_URL` at runtime (loaded from `.env` via dotenvy)
#   - Uses pepper-crm DB helpers and sqlx
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "mcp-scheduler-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-scheduler-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
pepper-crm = { path = "../pepper-crm" }
rmcp = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
