# MCP Google Calendar Server Package
#
#   Cargo manifest for the MCP server that fetches upcoming travel from Google Calendar ICS.
#
# INPUT:
#   - N/A (package metadata and dependency declarations)
#
# OUTPUT:
#   - `mcp-calendar-server` binary exposing the `get_upcoming_travel` MCP tool
#
# NOTES:
#   - Requires `GOOGLE_CALENDAR_ICS_URL` at runtime
#   - Distinct from mcp-cal-server (local .ics export for reconnects)
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "mcp-calendar-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-calendar-server"
path = "src/main.rs"

[dependencies]
pepper-crm = { path = "../pepper-crm" }
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
