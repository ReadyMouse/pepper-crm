# MCP Digest Server Package
#
#   Cargo manifest for the MCP server that renders the weekly CRM email digest.
#
# INPUT:
#   - N/A (package metadata and dependency declarations)
#
# OUTPUT:
#   - `mcp-digest-server` binary exposing the `render_digest` MCP tool
#
# NOTES:
#   - Delegates rendering to pepper-crm::render_digest_email
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "mcp-digest-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mcp-digest-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
pepper-crm = { path = "../pepper-crm" }
rmcp = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
