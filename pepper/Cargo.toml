# Pepper Orchestrator Package
#
#   Cargo manifest for the Pepper CRM weekly digest orchestrator CLI binary.
#
# INPUT:
#   - N/A (package metadata and dependency declarations)
#
# OUTPUT:
#   - `pepper` binary (src/main.rs) that coordinates MCP servers for digest workflow
#
# NOTES:
#   - Depends on pepper-crm library and rmcp for MCP stdio clients
#   - Built as part of the pepper-crm workspace; run via `cargo run -p pepper`
#
# Written by Cursor for Ready Mouse and Pepper CRM. May 2026. All rights reserved.

[package]
name = "pepper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pepper"
path = "src/main.rs"

[dependencies]
pepper-crm = { path = "../pepper-crm" }
# Workspace dependencies
rmcp = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }
